name: Bug Report
title: "[Bug]: "
description: Report a problem with the documentation site
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](https://github.com/Bridge-UI/docs/issues) before opening a new one.

        For **component library bugs** (runtime behavior, API issues, etc.), open an issue in [Bridge-UI/core](https://github.com/Bridge-UI/core/issues) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: The CodeBlock on the Button page does not switch to Vue when I change the framework selector.
    validations:
      required: true

  - type: input
    id: page-url
    attributes:
      label: Page URL or section
      description: Link to the page where the problem occurs, or the section name.
      placeholder: https://docs.example.com/en-us/components/button
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: false

  - type: dropdown
    id: locale
    attributes:
      label: Locale
      description: Which language version were you viewing?
      options:
        - English (en-us)
        - Portuguese (pt-br)
        - Both / not sure
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 131, Firefox 133, Safari 18, etc.
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04, etc.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag and drop images or videos here, or paste links.
      placeholder: Add screenshots or screen recordings if they help explain the problem.
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
